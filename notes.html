<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MastroFit - Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    const themeColor = localStorage.getItem('mastro_theme_color') || '#ff8c00';
    tailwind.config = { theme: { extend: { colors: { darkBg: '#121212', darkCard: '#1e1e1e', brandOrange: themeColor } } } };
    document.documentElement.style.setProperty('--theme-color', themeColor);
</script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, sans-serif; }
        /* Nasconde la freccia nativa del select per metterne una custom con FontAwesome */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen px-5 py-5 pb-20">

    <div class="flex items-center justify-between mb-8">
        <button onclick="window.location.href = 'index.html'" class="text-gray-400 hover:text-white flex items-center text-sm font-semibold transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Home
        </button>
        <h2 class="text-2xl font-bold text-white">Diario Note</h2>
    </div>

    <!-- SELETTORE DISCIPLINE -->
    <div class="bg-darkCard p-5 rounded-xl shadow-lg border border-gray-800 mb-6">
        
        <label class="block text-sm font-semibold text-gray-400 mb-2">Disciplina</label>
        <div class="relative mb-4">
            <select id="discipline-select" class="w-full bg-[#121212] text-white font-bold border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-brandOrange transition" onchange="cambiaDisciplina()">
                <option value="cali">🤸 Calisthenics</option>
                <option value="run">🏃 Corsa</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-gray-500 pointer-events-none"></i>
        </div>

        <!-- FILTRO CALISTHENICS (Apare solo se si seleziona Calisthenics) -->
        <div id="cali-filter-container">
            <label class="block text-sm font-semibold text-gray-400 mb-2 mt-4 border-t border-gray-700 pt-4">Filtra per Esercizio</label>
            <div class="relative">
                <select id="ex-select" class="w-full bg-[#121212] text-white border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-brandOrange transition" onchange="mostraNote()">
                    <option value="">Seleziona un esercizio...</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-gray-500 pointer-events-none"></i>
            </div>
        </div>

    </div>

    <div id="notes-container" class="space-y-4">
        <!-- Le note spuntano qui -->
    </div>

    <script>
        const noteCali = JSON.parse(localStorage.getItem('mastro_notes')) || {};
        const noteRun = JSON.parse(localStorage.getItem('mastro_running_notes')) || [];
        const exSelect = document.getElementById('ex-select');
        const caliFilter = document.getElementById('cali-filter-container');
        
        // Popola la tendina esercizi Calisthenics
        Object.keys(noteCali).forEach(ex => {
            exSelect.innerHTML += `<option value="${ex}">${ex}</option>`;
        });

        function cambiaDisciplina() {
            const disc = document.getElementById('discipline-select').value;
            if (disc === 'cali') {
                caliFilter.style.display = 'block';
                mostraNote(); // Ricarica la vista calisthenics
            } else {
                caliFilter.style.display = 'none';
                mostraNoteRun(); // Carica tutte le note della corsa
            }
        }

        // MOSTRA NOTE CALISTHENICS
        function mostraNote() {
            const container = document.getElementById('notes-container');
            const ex = exSelect.value;
            container.innerHTML = '';

            if(!ex || !noteCali[ex]) {
                if(document.getElementById('discipline-select').value === 'cali') {
                    container.innerHTML = '<p class="text-sm text-gray-500 italic text-center mt-6">Seleziona un esercizio per leggere le tue note.</p>';
                }
                return;
            }

            const noteReverse = [...noteCali[ex]].reverse();
            noteReverse.forEach(n => {
                let d = new Date(n.data);
                let dataFormattata = d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
                
                container.innerHTML += `
                    <div class="bg-darkCard p-4 rounded-xl border border-gray-800 border-l-4 border-l-brandOrange shadow-md">
                        <div class="text-xs text-brandOrange font-bold mb-2"><i class="fa-regular fa-calendar mr-1"></i> ${dataFormattata}</div>
                        <p class="text-gray-300 text-sm leading-relaxed">${n.testo}</p>
                    </div>
                `;
            });
        }

        // MOSTRA NOTE CORSA
        function mostraNoteRun() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            if (noteRun.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 italic text-center mt-6">Nessuna nota registrata per la corsa.</p>';
                return;
            }

            const reversed = [...noteRun].reverse();
            reversed.forEach(n => {
                let d = new Date(n.data);
                let dataFormattata = d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
                
                container.innerHTML += `
                    <div class="bg-darkCard p-4 rounded-xl border border-gray-800 border-l-4 border-l-blue-500 shadow-md">
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-xs text-blue-500 font-bold"><i class="fa-regular fa-calendar mr-1"></i> ${dataFormattata}</div>
                            <span class="text-[10px] bg-gray-800 text-gray-300 px-2 py-1 rounded font-bold">${n.titolo}</span>
                        </div>
                        <p class="text-gray-300 text-sm leading-relaxed">${n.testo}</p>
                    </div>
                `;
            });
        }

        // Avvia la vista corretta all'apertura
        cambiaDisciplina();
    </script>
</body>
</html>
