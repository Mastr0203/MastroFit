<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MastroFit - Profilo Globale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Configurazione Tema Dinamico -->
    <script>
        const themeColor = localStorage.getItem('mastro_theme_color') || '#ff8c00';
        tailwind.config = { theme: { extend: { colors: { darkBg: '#121212', darkCard: '#1e1e1e', brandOrange: themeColor } } } };
    </script>

    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 3px solid var(--theme-color, #ff8c00); color: var(--theme-color, #ff8c00); font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        input { background-color: #121212; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; margin-top: 5px; font-weight: bold; text-align: center; }
        input:focus { outline: none; border-color: var(--theme-color, #ff8c00); }
    </style>
    
    <!-- Iniezione variabile CSS per gli elementi statici -->
    <script>document.documentElement.style.setProperty('--theme-color', themeColor);</script>
</head>
<body class="max-w-md mx-auto min-h-screen px-5 py-5 pb-20">

    <div class="flex items-center justify-between mb-6">
        <button onclick="window.location.href = 'index.html'" class="text-gray-400 hover:text-white flex items-center text-sm font-semibold transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Home
        </button>
        <h2 class="text-2xl font-bold text-white">Profilo Globale</h2>
    </div>

    <!-- KPI GLOBALI (Forza + Corsa) - Tonnellaggio Rimosso -->
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-darkCard p-3 rounded-xl border border-gray-800 text-center shadow-lg">
            <i class="fa-solid fa-fire text-brandOrange mb-1"></i>
            <h3 class="text-xl font-black text-white" id="stat-workouts">0</h3>
            <p class="text-[10px] uppercase text-gray-500 font-bold">Workout</p>
        </div>
        <div class="bg-darkCard p-3 rounded-xl border border-gray-800 text-center shadow-lg">
            <i class="fa-solid fa-stopwatch text-brandOrange mb-1"></i>
            <h3 class="text-xl font-black text-white" id="stat-tut">0h 0m</h3>
            <p class="text-[10px] uppercase text-gray-500 font-bold">Tempo Tot.</p>
        </div>
        <div class="bg-darkCard p-3 rounded-xl border border-gray-800 text-center shadow-lg">
            <i class="fa-solid fa-route text-brandOrange mb-1"></i>
            <h3 class="text-xl font-black text-white" id="stat-km">0.0</h3>
            <p class="text-[10px] uppercase text-gray-500 font-bold">Km Totali</p>
        </div>
    </div>

    <div class="flex border-b border-gray-800 mb-6">
        <button class="tab-btn active px-4 py-3 text-sm text-gray-400 w-1/2" onclick="switchTab('misure', this)">Body Recomp</button>
        <button class="tab-btn px-4 py-3 text-sm text-gray-400 w-1/2" onclick="switchTab('export', this)">Data Export</button>
    </div>

    <!-- TAB: MISURE -->
    <div id="tab-misure" class="tab-content active space-y-4">
        <div class="bg-darkCard p-4 rounded-xl border border-gray-800 mb-4 flex justify-center">
            <canvas id="radarChart" width="300" height="300"></canvas>
        </div>
        <div class="bg-darkCard p-5 rounded-xl border border-gray-800">
            <h3 class="text-lg font-bold mb-4">Aggiorna Misure (cm)</h3>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-xs text-gray-400">Peso (kg)</label><input type="number" id="mis-peso" step="0.1"></div>
                <div><label class="text-xs text-gray-400">Spalle (cm)</label><input type="number" id="mis-spalle" step="0.1"></div>
                <div><label class="text-xs text-gray-400">Petto (cm)</label><input type="number" id="mis-petto" step="0.1"></div>
                <div><label class="text-xs text-gray-400">Braccia (cm)</label><input type="number" id="mis-braccia" step="0.1"></div>
                <div class="col-span-2"><label class="text-xs text-gray-400">Vita (cm)</label><input type="number" id="mis-vita" step="0.1"></div>
            </div>
            <button onclick="salvaMisure()" class="w-full bg-brandOrange text-white font-bold py-3 rounded-lg mt-5 active:scale-95 transition">Salva Misure</button>
        </div>
    </div>

    <!-- TAB: EXPORT -->
    <div id="tab-export" class="tab-content">
        <div class="bg-darkCard p-5 rounded-xl border border-gray-800 text-center space-y-4">
            <i class="fa-solid fa-file-excel text-5xl text-green-600 mb-2"></i>
            <h3 class="text-xl font-bold">Estrazione Dataset Globale</h3>
            <p class="text-sm text-gray-400">Scarica il file XLSX contenente Storico Calisthenics, Corsa, Misure e Record.</p>
            <button onclick="esportaExcel()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4 active:scale-95 transition">Genera File Excel</button>
        </div>
    </div>

    <script>
        const storicoCali = JSON.parse(localStorage.getItem('mastro_workout_history')) || [];
        const storicoRun = JSON.parse(localStorage.getItem('mastro_running_history')) || [];
        const misure = JSON.parse(localStorage.getItem('mastro_misure')) || [];
        
        let radarChartInstance = null;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function calcolaMinutiDaStringa(durataStr) {
            if(!durataStr) return 0;
            let p = durataStr.split(':');
            if(p.length === 2) return parseInt(p[0]) + (parseInt(p[1])/60);
            return 0;
        }

        function initDashboard() {
            let totWorkouts = storicoCali.length + storicoRun.length;
            let totMinuti = 0; let totKm = 0;

            storicoCali.forEach(s => {
                totMinuti += calcolaMinutiDaStringa(s.durata);
            });
            storicoRun.forEach(r => {
                totMinuti += (parseInt(r.minuti) + parseInt(r.secondi)/60);
                totKm += parseFloat(r.km);
            });

            document.getElementById('stat-workouts').innerText = totWorkouts;
            document.getElementById('stat-tut').innerText = `${Math.floor(totMinuti / 60)}h ${Math.round(totMinuti % 60)}m`;
            document.getElementById('stat-km').innerText = totKm.toFixed(1);

            disegnaRadar();
        }

        function salvaMisure() {
            misure.push({
                data: new Date().toISOString().split('T')[0],
                peso: parseFloat(document.getElementById('mis-peso').value) || 0,
                spalle: parseFloat(document.getElementById('mis-spalle').value) || 0,
                petto: parseFloat(document.getElementById('mis-petto').value) || 0,
                braccia: parseFloat(document.getElementById('mis-braccia').value) || 0,
                vita: parseFloat(document.getElementById('mis-vita').value) || 0
            });
            localStorage.setItem('mastro_misure', JSON.stringify(misure));
            disegnaRadar();
        }

        function disegnaRadar() {
            if (radarChartInstance) radarChartInstance.destroy();
            let dCurr = [0,0,0,0,0]; let dPrev = [0,0,0,0,0];
            if (misure.length > 0) { let c = misure[misure.length - 1]; dCurr = [c.spalle, c.petto, c.braccia, c.vita, c.peso]; }
            if (misure.length > 1) { let p = misure[misure.length - 2]; dPrev = [p.spalle, p.petto, p.braccia, p.vita, p.peso]; }

            const ctx = document.getElementById('radarChart').getContext('2d');
            
            // Colore Dinamico
            const tColor = localStorage.getItem('mastro_theme_color') || '#ff8c00';

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Spalle', 'Petto', 'Braccia', 'Vita', 'Peso'],
                    datasets: [
                        { label: 'Attuale', data: dCurr, backgroundColor: tColor + '66', borderColor: tColor, borderWidth: 2 },
                        { label: 'Precedente', data: dPrev, backgroundColor: 'transparent', borderColor: '#444', borderWidth: 1, borderDash: [5,5] }
                    ]
                },
                options: { scales: { r: { angleLines:{color:'#333'}, grid:{color:'#333'}, pointLabels:{color:'#aaa'}, ticks:{display:false} } } }
            });
        }

        function esportaExcel() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(storicoCali.length ? storicoCali : [{Info:"Vuoto"}]), "Calisthenics");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(storicoRun.length ? storicoRun : [{Info:"Vuoto"}]), "Corsa");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(misure.length ? misure : [{Info:"Vuoto"}]), "Misure");
            XLSX.writeFile(wb, "MastroFit_Global_Data.xlsx");
        }

        initDashboard();
    </script>
</body>
</html>
