<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MastroFit - Home</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { darkBg: '#121212', darkCard: '#1e1e1e', brandOrange: '#ff8c00' } } } }</script>
    <style>body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col px-6 py-8 relative">

    <header class="flex justify-between items-center mb-12 mt-4">
        <div>
            <h1 class="text-5xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brandOrange to-red-500">
                MastroFit
            </h1>
            <p class="text-gray-400 text-sm font-semibold mt-1">Calisthenics & Data</p>
        </div>
        
        <div class="flex space-x-3">
            <!-- Tasto NOTE (Ora con stile arancione neon) -->
            <div onclick="window.location.href = 'notes.html'" class="cursor-pointer w-12 h-12 rounded-full bg-darkCard flex items-center justify-center text-brandOrange shadow-[0_0_15px_rgba(255,140,0,0.4)] border border-brandOrange/30 transition active:scale-95">
                <i class="fa-solid fa-note-sticky text-lg"></i>
            </div>
            <!-- Tasto PROFILO -->
            <div onclick="window.location.href = 'profile.html'" class="cursor-pointer w-12 h-12 rounded-full bg-darkCard flex items-center justify-center text-brandOrange shadow-[0_0_15px_rgba(255,140,0,0.4)] border border-brandOrange/30 transition active:scale-95">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
        </div>
    </header>

    <main class="flex-1 space-y-6">
        <div onclick="window.location.href = 'calisthenics.html'" class="relative bg-darkCard p-8 rounded-3xl border border-gray-800 shadow-2xl cursor-pointer overflow-hidden group active:scale-95 transition transform">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-brandOrange rounded-full filter blur-[70px] opacity-20"></div>
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <h2 class="text-3xl font-black text-white mb-2">Calisthenics</h2>
                    <p class="text-gray-400 text-sm">Hub Schede & Tracking</p>
                </div>
                <div class="w-16 h-16 rounded-full bg-brandOrange/20 flex items-center justify-center text-brandOrange">
                    <i class="fa-solid fa-dumbbell text-3xl"></i>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-8 text-center text-gray-600 text-xs font-bold tracking-widest uppercase">
        Data Driven Training
    </footer>
</body>
</html>
