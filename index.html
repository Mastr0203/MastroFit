<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MastroFit - Home</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // TRUCCO MAGIC: Leggiamo il colore e lo iniettiamo in Tailwind
        const themeColor = localStorage.getItem('mastro_theme_color') || '#ff8c00';
        
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { darkBg: '#121212', darkCard: '#1e1e1e', brandOrange: themeColor },
                    boxShadow: { glow: `0 0 15px ${themeColor}66` } // Genera l'ombra col nuovo colore (66 = 40% opacità)
                } 
            } 
        };
    </script>
    <style>body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col px-6 py-8 relative">

    <header class="flex justify-between items-center mb-12 mt-4">
        <div>
            <h1 class="text-5xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brandOrange to-red-500">
                MastroFit
            </h1>
            <p class="text-gray-400 text-sm font-semibold mt-1">Data Driven Training</p>
        </div>
        
        <div class="flex space-x-3">
            <!-- Tasto IMPOSTAZIONI -->
            <div onclick="document.getElementById('settings-modal').classList.remove('hidden')" class="cursor-pointer w-12 h-12 rounded-full bg-darkCard flex items-center justify-center text-brandOrange shadow-glow border border-brandOrange/30 transition active:scale-95">
                <i class="fa-solid fa-gear text-lg"></i>
            </div>
            <!-- Tasto NOTE -->
            <div onclick="window.location.href = 'notes.html'" class="cursor-pointer w-12 h-12 rounded-full bg-darkCard flex items-center justify-center text-brandOrange shadow-glow border border-brandOrange/30 transition active:scale-95">
                <i class="fa-solid fa-note-sticky text-lg"></i>
            </div>
            <!-- Tasto PROFILO GLOBALE -->
            <div onclick="window.location.href = 'profile.html'" class="cursor-pointer w-12 h-12 rounded-full bg-darkCard flex items-center justify-center text-brandOrange shadow-glow border border-brandOrange/30 transition active:scale-95">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
        </div>
    </header>

    <main class="flex-1 space-y-6">
        
        <!-- CARD 1: CALISTHENICS -->
        <div onclick="window.location.href = 'calisthenics.html'" class="relative bg-darkCard p-8 rounded-3xl border border-gray-800 shadow-2xl cursor-pointer overflow-hidden group active:scale-95 transition transform">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-brandOrange rounded-full filter blur-[70px] opacity-20"></div>
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <h2 class="text-3xl font-black text-white mb-2">Calisthenics</h2>
                    <p class="text-gray-400 text-sm">Forza, Skills & Note</p>
                </div>
                <div class="w-16 h-16 rounded-full bg-brandOrange/20 flex items-center justify-center text-brandOrange">
                    <i class="fa-solid fa-dumbbell text-3xl"></i>
                </div>
            </div>
        </div>

        <!-- CARD 2: CORSA -->
        <div onclick="window.location.href = 'running.html'" class="relative bg-darkCard p-8 rounded-3xl border border-gray-800 shadow-2xl cursor-pointer overflow-hidden group active:scale-95 transition transform">
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-brandOrange rounded-full filter blur-[70px] opacity-20"></div>
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <h2 class="text-3xl font-black text-white mb-2">Corsa</h2>
                    <p class="text-gray-400 text-sm">Passo & Record</p>
                </div>
                <div class="w-16 h-16 rounded-full bg-brandOrange/20 flex items-center justify-center text-brandOrange">
                    <i class="fa-solid fa-person-running text-3xl"></i>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-auto py-8 text-center text-gray-600 text-xs font-bold tracking-widest uppercase">
        Data Driven Training &copy; 2026
    </footer>

    <!-- MODAL IMPOSTAZIONI -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-center items-center">
        <div class="bg-darkCard p-6 rounded-2xl border border-gray-800 w-11/12 max-w-sm">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white">Impostazioni</h3>
                <button onclick="document.getElementById('settings-modal').classList.add('hidden')" class="text-gray-400 text-2xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <p class="text-sm font-bold text-gray-400 mb-4 uppercase tracking-widest text-center">Tema Interfaccia</p>
            
            <!-- SELETTORE COLORI -->
            <div class="grid grid-cols-3 gap-4 mb-4">
                <button onclick="setTheme('#ff8c00')" class="w-14 h-14 rounded-full mx-auto bg-[#ff8c00] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
                <button onclick="setTheme('#00bcd4')" class="w-14 h-14 rounded-full mx-auto bg-[#00bcd4] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
                <button onclick="setTheme('#2563eb')" class="w-14 h-14 rounded-full mx-auto bg-[#2563eb] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
                <button onclick="setTheme('#16a34a')" class="w-14 h-14 rounded-full mx-auto bg-[#16a34a] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
                <button onclick="setTheme('#dc2626')" class="w-14 h-14 rounded-full mx-auto bg-[#dc2626] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
                <button onclick="setTheme('#9333ea')" class="w-14 h-14 rounded-full mx-auto bg-[#9333ea] border-2 border-transparent focus:border-white shadow-lg active:scale-90 transition"></button>
            </div>
        </div>
    </div>

    <script>
        function setTheme(colorHex) {
            localStorage.setItem('mastro_theme_color', colorHex);
            location.reload(); // Ricarica la pagina istantaneamente per applicare
        }
    </script>
</body>
</html>
